name: DART Financial Update
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Save DART report originals
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/save_reports.py
      - name: Crawl structured financial data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/crawl_dart.py
      - name: Preserve legacy originals
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/legacy_dart.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update DART data"
          git push
